# Binder Evaluation Configuration
#
# All metric computation settings for evaluating generated binders.
# Note: target_dict_cfg comes from generation config (via binder_generate)

# =============================================================================
# Evaluation mode
# =============================================================================
protein_type: binder # [monomer, binder]
input_mode: generated
dryrun: false
show_progress: false

# =============================================================================
# Metrics
# =============================================================================
metric:
  # ---------------------------------------------------------------------------
  # Binder refolding metrics
  # ---------------------------------------------------------------------------
  compute_binder_metrics: true
  
  # Folding method: colabdesign, rf3_latest, boltz2_default, esmfold
  binder_folding_method: colabdesign
  
  # Sequence types: self (generated), mpnn (redesign all), mpnn_fixed (fixed interface)
  sequence_types: [self] #[self, mpnn, mpnn_fixed]
  
  # Inverse folding settings
  num_redesign_seqs: 2
  interface_cutoff: 8.0
  inverse_folding_model: soluble_mpnn  # protein_mpnn, ligand_mpnn, soluble_mpnn
  
  #esm metrics
  compute_esm_metrics: true
  # Ranking criteria for best refolded sample (null = defaults)
  ranking_criteria: null

  # ---------------------------------------------------------------------------
  # Pre-refolding interface metrics (on generated structures)
  # ---------------------------------------------------------------------------
  # For cyclic peptides these are the load-bearing interface numbers: AF2's pLDDT/i_pAE are
  # computed on a refold that has no macrocycle bond, whereas Rosetta scores the GENERATED
  # structure, which does carry the closed ring. dG_separated / dSASA_int therefore measure
  # target engagement on geometry the model actually produced.
  compute_pre_refolding_metrics: true
  pre_refolding:
    bioinformatics: false  # Shape complementarity, SASA, hydrophobicity (requires sc/dssp binaries)
    tmol: false            # TMOL force field (H-bonds, electrostatics)
    rosetta: true          # PyRosetta interface dG_separated (requires PyRosetta)
    cyclization: true      # Macrocycle closing-bond distance / closed / fused, and whether the
                           # requested cyclization type was actually built. No-op for a binder
                           # with no cyclization chemistry at its termini; costs a PDB parse.

  # ---------------------------------------------------------------------------
  # Post-refolding interface metrics (on refolded structures)
  # ---------------------------------------------------------------------------
  # Rosetta is left OFF here on purpose. Scoring the refolded structure means scoring an AF2
  # prediction of a LINEAR peptide -- the macrocycle bond is gone, so its interface energy is
  # not the designed molecule's. It is also ~17 seqs x N designs of constrained FastRelax
  # (~90 s each), i.e. hours per target, versus N for pre_refolding. Turn on only to compare
  # a refold against its generated counterpart deliberately.
  compute_refolded_structure_metrics: false
  refolded:
    bioinformatics: false
    tmol: false
    rosetta: false

  # ---------------------------------------------------------------------------
  # Monomer metrics (set compute_monomer_metrics to enable)
  # ---------------------------------------------------------------------------
  compute_monomer_metrics: true
  monomer_folding_models: [esmfold]  # Shared across des/codes

  compute_designability: true
  designability_modes: [ca]

  compute_codesignability: true
  codesignability_modes: [ca, all_atom]

  compute_co_sequence_recovery: false

  # Secondary structure proportions (alpha helix, beta sheet, coil) via biotite
  compute_ss: true

  # Novelty metrics
  compute_novelty_pdb: false
  compute_novelty_afdb: false
  compute_novelty_afdb_rep_v4: false
  compute_novelty_afdb_rep_v4_geniefilters_maxlen512: false

  # Output control
  keep_folding_outputs: true
