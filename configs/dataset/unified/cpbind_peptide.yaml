# CPBind cyclic peptide–receptor complexes
#
# Data root: ${oc.env:CPBIND_DATA_PATH} (default: /zfsauton/scratch/yixiz/CPSea/CPBind)
# Preprocessed with the same script_utils/preprocess_cpsea.py as CPSea, so the layout, the
# parquet column schema, and the `cpsea_{train,val,test}.parquet` filenames are identical --
# only the root differs. The transform chain below is therefore the same as cpsea_peptide.yaml.
#
# Scale: 545,300 structures (train 491,667 / val 25,853 / test 27,780) -- ~44x CPSea_PDB.
# Binder is chain B throughout; peptide_length 5-16, within CroppingTransform2's binder bounds.
# Exactly one kept CONECT bond per structure, so the single-cyclization-edge assumption holds.
#
# Pipeline: PDB → AtomArray → atom37 Data → atom37_transforms → model

datamodule:
  _target_: proteinfoundation.datasets.structure_data.StructureDataModule
  metadata_file: ${oc.env:CPBIND_DATA_PATH,/zfsauton/scratch/yixiz/CPSea/CPBind}/preprocessed/metadata/cpsea_train.parquet
  val_metadata_file: ${oc.env:CPBIND_DATA_PATH,/zfsauton/scratch/yixiz/CPSea/CPBind}/preprocessed/metadata/cpsea_val.parquet
  base_dir: ""
  batch_size: 6
  num_workers: 8
  path_column: path
  id_column: example_id
  pin_memory: true
  use_parse: false

  columns_to_load:
    - example_id
    - path
    - binder_chain_id
    - cluster_id
    - peptide_length
    - cyclization_type

  atom37_transforms:
    # Must run first: detects continuous backbone segments (segment_id, pos_in_segment,
    # effective_chain_id) from the raw, un-cropped, un-rotated residue order and Angstrom
    # coordinates. Receptor/target chains are discontinuous receptor/pocket crops;
    # see docs/README_DATA_SEQ_BREAK_ISSUE.md.
    - _target_: proteinfoundation.datasets.transforms.SegmentAwareResidueFeaturesTransform
      cn_break_cutoff: 2.0
      segment_fix_level: full
    - _target_: proteinfoundation.datasets.transforms.CoordsToNanometers
    - _target_: proteinfoundation.datasets.transforms.GlobalRotationTransform
    - _target_: proteinfoundation.datasets.transforms.CroppingTransform2
      crop_size: 256
      interface_threshold: 8.0
      dist_mode: "bb_ca"
      data_mode: "all-atom"
      binder_min_length: 5
      binder_max_length: 16
      binder_padding_length: 0
      target_min_length: 30
      target_spatial_crop_threshold: 15.0
      max_num_target_chains: -1
    - _target_: proteinfoundation.datasets.transforms.ContactTransform
      cutoff: 8.0
      min_perc: 0.0
      max_perc: 0.2
      contact_prob: 1.0
      contact_dropout_prob: 0.5
      hotspot_dropout_prob: 0.5
    - _target_: proteinfoundation.datasets.transforms.OpenFoldFrameTransform
    - _target_: proteinfoundation.datasets.transforms.ChainBreakPerResidueTransform
    - _target_: proteinfoundation.datasets.transforms.CenteringTransform
      center_mode: "target"
      data_mode: "all-atom"
    - _target_: proteinfoundation.datasets.transforms.ExtractTargetCoordinatesTransform
      compact_mode: true
    - _target_: proteinfoundation.datasets.transforms.FilterTargetResiduesTransform
    # Must run after FilterTargetResiduesTransform: needs binder-local (0..L_b-1) indexing.
    # Derives the single ground-truth cyclization edge (cyclization_i/j/type, has_cyclization)
    # for the CyclizationLinkHead from the preserved CONECT records.
    - _target_: proteinfoundation.datasets.transforms.CyclizationLabelTransform
      default_binder_chain_id: "B"
