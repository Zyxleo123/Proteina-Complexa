# CPSea peptide dataset with RECEPTOR pocket-surface caches attached (non-circular
# counterpart to cpsea_peptide_surface.yaml).
#
# Identical to cpsea_peptide_surface.yaml except AttachReceptorSurfaceTransform replaces
# AttachPeptideSurfaceTransform: the peptide-surface arm conditions/supervises binder
# generation against the GROUND-TRUTH PEPTIDE's own surface, which is close to leaking the
# answer since the receptor is already given separately via x_target. This arm instead
# attaches the receptor pocket's surface facing the peptide -- genuinely new shape
# information about the site the binder must fit into (a molecular surface, not the atom
# skeleton x_target already provides). See
# proteinfoundation.surface.peptide_surface.extract_receptor_surface's docstring for the
# full argument.
#
# Requires precomputed RECEPTOR caches (a separate extraction pass from the peptide ones,
# --role receptor -- see scripts/extract_peptide_surfaces.py and the sbatch launcher at
# scripts/slurm/extract_receptor_surfaces.sbatch):
#   python scripts/extract_peptide_surfaces.py --role receptor --dataset-config ... \
#     --output-dir <receptor_surface_dir>
#
# CPSEA_RECEPTOR_SURFACE_DIR is REQUIRED -- deliberately no default, same reasoning as
# CPSEA_SURFACE_DIR in cpsea_peptide_surface.yaml (a launcher that forgot to export it
# should fail loudly on the first row, not silently train on whatever happened to be
# lying around). Full data:
#   export CPSEA_RECEPTOR_SURFACE_DIR=$PROTEINA_ZFS_PATH/surfaces/cpsea_receptor

datamodule:
  _target_: proteinfoundation.datasets.structure_data.StructureDataModule
  metadata_file: ${oc.env:CPSEA_DATA_PATH}/preprocessed/metadata/cpsea_train.parquet
  val_metadata_file: ${oc.env:CPSEA_DATA_PATH}/preprocessed/metadata/cpsea_val.parquet
  base_dir: ""
  batch_size: 6
  num_workers: 8
  path_column: path
  id_column: example_id
  pin_memory: true
  use_parse: false

  columns_to_load:
    - example_id
    - path
    - binder_chain_id
    - cluster_id
    - peptide_length
    - cyclization_type

  atom37_transforms:
    - _target_: proteinfoundation.datasets.transforms.SegmentAwareResidueFeaturesTransform
      cn_break_cutoff: 2.0
      segment_fix_level: full
    - _target_: proteinfoundation.datasets.transforms.AttachReceptorSurfaceTransform
      surface_dir: ${oc.env:CPSEA_RECEPTOR_SURFACE_DIR}
      num_points: 96
      require_surface: true
    - _target_: proteinfoundation.datasets.transforms.CoordsToNanometers
    - _target_: proteinfoundation.datasets.transforms.GlobalRotationTransform
    - _target_: proteinfoundation.datasets.transforms.CroppingTransform2
      crop_size: 256
      interface_threshold: 8.0
      dist_mode: "bb_ca"
      data_mode: "all-atom"
      crop_binder: false
      binder_min_length: 5
      binder_max_length: 16
      binder_padding_length: 0
      target_min_length: 30
      target_spatial_crop_threshold: 15.0
      max_num_target_chains: -1
    - _target_: proteinfoundation.datasets.transforms.ContactTransform
      cutoff: 8.0
      min_perc: 0.0
      max_perc: 0.2
      contact_prob: 1.0
      contact_dropout_prob: 0.5
      hotspot_dropout_prob: 0.5
    - _target_: proteinfoundation.datasets.transforms.OpenFoldFrameTransform
    - _target_: proteinfoundation.datasets.transforms.ChainBreakPerResidueTransform
    - _target_: proteinfoundation.datasets.transforms.CenteringTransform
      center_mode: "target"
      data_mode: "all-atom"
    - _target_: proteinfoundation.datasets.transforms.ExtractTargetCoordinatesTransform
      compact_mode: true
    - _target_: proteinfoundation.datasets.transforms.FilterTargetResiduesTransform
    - _target_: proteinfoundation.datasets.transforms.CyclizationLabelTransform
      default_binder_chain_id: "B"
