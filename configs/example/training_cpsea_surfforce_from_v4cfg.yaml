# @package _global_
# ARM S3 -- FORCED surface participation: ARM S2 with the cross-attention gate PINNED OPEN.
#
# WHY THIS EXISTS. S1 (`cpsea_surfcond_from_v4cfg`) and S2 (`cpsea_surfloss_from_v4cfg`)
# both ran 25k steps and neither one ever turned the surface on. Measured from their
# .wandb logs:
#
#   train/surface_gate/abs_mean   S1: 0 -> 1.9e-4     S2: 0 -> 1.9e-4
#   per-layer g (3 / 7 / 11)      end |g| ~ 1e-5..3e-4, sign flipping, no drift
#
# With `h <- h + g*Delta` at g ~ 1e-4 the surface contributes nothing to the forward
# pass, AND the encoder's gradient is dL/dDelta = g ~ 0, so Delta stays a random
# projection -- a deadlock, not a decision. A single scalar must guess the sign of a
# noisy inner product against a randomly-initialized branch before that branch can
# become useful.
#
# S3 sets `nn.surface.gate_learnable: false`, making g a fixed buffer at `gate_init`.
# The encoder then always receives a nonvanishing gradient. This does NOT force the
# model to USE the surface -- the per-token sigmoid `to_g` and the `to_out` projection
# inside PairBiasedCrossAttention can still suppress the branch -- it only forces the
# pathway to stay differentiable. gate_init is 0.25, not 1.0: this warm-starts from a
# pretrained checkpoint, and injecting a full-magnitude random-init residual into three
# layers at once spikes the loss for no benefit; 0.25 gives the same nonvanishing
# gradient far more gently.
#
# The aux loss is ALSO reweighted. In S2 `surface_attraction` fell 0.15 -> 0.04 nm while
# the gates sat at 1e-4 -- i.e. the contact loss was fully satisfied WITHOUT any surface
# information entering the network, by learning the marginal pose. At loss_weight 0.1
# it contributed 0.1 * 0.04 = 0.004 of a total train loss of ~6.25, i.e. 0.06%, which is
# far too little to move a gate even if the gate were free. loss_weight 2.0 puts it at
# roughly 1% of the total. t_lower_lim drops 0.5 -> 0.1 because at t >= 0.5 the pose is
# already determined by x_t, so the loss only spoke where the answer was already known.
#
# WHAT TO WATCH. `train/surface_specificity` (= the same predicted structure re-scored
# against a batch-rolled MISMATCHED surface, minus the true-surface loss) is the metric
# that matters. It is the only part of `surface_attraction` that cannot be obtained by
# ignoring the surface. If it stays ~0 while `surface_attraction` falls, the conditioning
# is still inert and the next lever is a contrastive term, not a bigger weight.
#
# Compare against S2 on the SAME val_gen population (batch 16 x accum 8, 64 cyclizations).

# Run:
#   CONFIG_NAME=example/training_cpsea_surfforce_from_v4cfg \
#     RUN_NAME=cpsea_surfforce_from_v4cfg \
#     PARTITION=general QOS=qos_general TIME=2-00:00:00 \
#     bash scripts/submit_replay_ablation_train.sh

ae_reg_weight: 1.0
autoencoder_ckpt_path: ${oc.env:CPSEA_AE_CKPT_PATH}
cyclization:
  allow_asn_gln_isopeptide: true
  bond_loss:
    enabled: true
    loss_weight: 0.05
    t_lower_lim: 0.5
  detach_link_inputs: true
  enabled: true
  force_gold_valid: true
  hidden_dim: 256
  loss_weight: 0.1
  target_type: null
  terminal_only: true
  type_conditioning: true
dataset:
  datamodule:
    # Rows that have a cached receptor surface. 2,444,208 rows vs CPSea_full's
    # 2,444,209 -- this is a surface-availability filter, NOT a smaller dataset.
    # Overrides `dataset.unified.datamodule.metadata_file`: train.py:202 does
    # OmegaConf.merge(unified, override), so this key wins.
    metadata_file: /zfsauton/scratch/yixiz/Proteina-Complexa/surfaces/cpsea/metadata/cpsea_train_surfready.parquet
    val_metadata_file: /zfsauton/scratch/yixiz/Proteina-Complexa/surfaces/cpsea/metadata/cpsea_val_surfready.parquet
    batch_size: 16
    num_workers: 8
  unified:
    datamodule:
      _target_: proteinfoundation.datasets.structure_data.StructureDataModule
      atom37_transforms:
      - _target_: proteinfoundation.datasets.transforms.SegmentAwareResidueFeaturesTransform
        cn_break_cutoff: 2.0
        segment_fix_level: full
      - _target_: proteinfoundation.datasets.transforms.AttachReceptorSurfaceTransform
        num_points: 96
        require_surface: true
        surface_dir: /zfsauton/scratch/yixiz/Proteina-Complexa/surfaces/cpsea_receptor
      - _target_: proteinfoundation.datasets.transforms.CoordsToNanometers
      - _target_: proteinfoundation.datasets.transforms.GlobalRotationTransform
      - _target_: proteinfoundation.datasets.transforms.CroppingTransform2
        binder_max_length: 16
        binder_min_length: 5
        binder_padding_length: 0
        crop_binder: false
        crop_size: 256
        data_mode: all-atom
        dist_mode: bb_ca
        interface_threshold: 8.0
        max_num_target_chains: -1
        target_min_length: 30
        target_spatial_crop_threshold: 15.0
      - _target_: proteinfoundation.datasets.transforms.ContactTransform
        contact_dropout_prob: 0.5
        contact_prob: 1.0
        cutoff: 8.0
        hotspot_dropout_prob: 0.5
        max_perc: 0.2
        min_perc: 0.0
      - _target_: proteinfoundation.datasets.transforms.OpenFoldFrameTransform
      - _target_: proteinfoundation.datasets.transforms.ChainBreakPerResidueTransform
      - _target_: proteinfoundation.datasets.transforms.CenteringTransform
        center_mode: target
        data_mode: all-atom
      - _target_: proteinfoundation.datasets.transforms.ExtractTargetCoordinatesTransform
        compact_mode: true
      - _target_: proteinfoundation.datasets.transforms.FilterTargetResiduesTransform
      - _target_: proteinfoundation.datasets.transforms.CyclizationLabelTransform
        default_binder_chain_id: B
      base_dir: ''
      batch_size: 6
      columns_to_load:
      - example_id
      - path
      - binder_chain_id
      - cluster_id
      - peptide_length
      - cyclization_type
      id_column: example_id
      metadata_file: /zfsauton/scratch/yixiz/CPSea/CPSea_full/CPSea/preprocessed/metadata/cpsea_train.parquet
      num_workers: 8
      path_column: path
      pin_memory: true
      use_parse: false
      val_metadata_file: /zfsauton/scratch/yixiz/CPSea/CPSea_full/CPSea/preprocessed/metadata/cpsea_val.parquet
ema:
  cpu_offload: false
  decay: 0.999
  every_n_steps: 1
  validate_original_weights: false
force_precision_f32: true
freeze_autoencoder: true
generation:
  args:
    ag_ckpt_path: null
    ag_ratio: 0.0
    fold_cond: false
    guidance_w: 1.0
    nsteps: 200
    self_cond: false
  dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 5
    collate_fn:
      _partial_: true
      _target_: proteinfoundation.datasets.gen_dataset.collate_fn
      padding_values:
        chains: -1
        target_chains: -1
    dataset:
      _target_: proteinfoundation.datasets.gen_dataset.GenDataset
      conditional_features: null
      nrepeat_per_sample: 20
      nres:
      - 50
      - 100
      task_name: null
      transforms: null
    shuffle: false
  metric:
    compute_designability: false
    compute_novelty_afdb: false
    compute_novelty_pdb: false
  model:
    ode:
      bb_ca:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: uniform
          p: 1.0
        simulation_step_params:
          center_every_step: true
          sampling_mode: vf
          sc_scale_noise: 0.0
          sc_scale_score: 0.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
      local_latents:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: uniform
          p: 1.0
        simulation_step_params:
          center_every_step: false
          sampling_mode: vf
          sc_scale_noise: 0.0
          sc_scale_score: 0.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
    temp_035_all:
      bb_ca:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: uniform
          p: 1.0
        simulation_step_params:
          center_every_step: true
          sampling_mode: sc
          sc_scale_noise: 0.35
          sc_scale_score: 1.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
      local_latents:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: uniform
          p: 1.0
        simulation_step_params:
          center_every_step: false
          sampling_mode: sc
          sc_scale_noise: 0.35
          sc_scale_score: 1.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
    temp_035_only_ca:
      bb_ca:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: uniform
          p: 1.0
        simulation_step_params:
          center_every_step: true
          sampling_mode: sc
          sc_scale_noise: 0.35
          sc_scale_score: 1.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
      local_latents:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: uniform
          p: 1.0
        simulation_step_params:
          center_every_step: false
          sampling_mode: vf
          sc_scale_noise: 0.0
          sc_scale_score: 0.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
hardware:
  accelerator: gpu
  ncpus_per_task_prepro_: 4
  ncpus_per_task_train_: 8
  ngpus_per_node_: 1
  nnodes_: 1
log:
  checkpoint: true
  checkpoint_every_n_steps: null
  last_ckpt_every_n_steps: 1500
  log_every_n_steps: 1
  log_wandb: true
  save_extra_checkpoints: false
  wandb_entity: null
  wandb_project: cpsea_cyclization
lora:
  lora_alpha: 32.0
  lora_dropout: 0.0
  r: null
  train_bias: none
loss:
  t_distribution:
    bb_ca:
      loss_t_clamp: 1.0
      name: mix_unif_beta
      p1: 1.9
      p2: 1.0
      p3: 0.02
    local_latents:
      name: uniform
      p1: 1.0
      p2: 1.0
    shared_groups: []
nn:
  enable_surface: true
  surface:
    gate_layers: [3, 7, 11]
    num_points: 96
    pair_dim: 256
    rbf_n: 16
    # THE ARM. g is a fixed buffer at gate_init instead of a learnable scalar that
    # never left ~1e-4 in S1/S2. See the header.
    gate_init: 0.25
    gate_learnable: false
  concat_features:
    enable_ligand: false
    enable_motif: false
    enable_target: true
    ligand_pair_features: false
    motif_pair_features: false
    target_pair_features: true
  cyc_emb_dim: 256
  dim_cond: 256
  feats_cond_seq:
  - time_emb_bb_ca
  - time_emb_local_latents
  - cyclization_type_emb
  feats_pair_cond:
  - time_emb_bb_ca
  - time_emb_local_latents
  feats_pair_repr:
  - rel_seq_sep
  - xt_bb_ca_pair_dists
  - x_sc_bb_ca_pair_dists
  - optional_ca_pair_dist
  - chain_idx_pair
  - hotspot_mask_pair
  - cyclization_ring_pe
  feats_seq:
  - xt_bb_ca
  - xt_local_latents
  - x_sc_bb_ca
  - x_sc_local_latents
  - optional_ca_coors_nm_seq_feat
  - optional_res_type_seq_feat
  - hotspot_mask_seq
  - res_seq_pdb_idx
  idx_emb_dim: 256
  name: local_latents_transformer
  nheads: 12
  nlayers: 14
  output_parameterization:
    bb_ca: v
    local_latents: v
  pair_repr_dim: 256
  parallel_mha_transition: false
  ring_sep_dim: 32
  seq_sep_dim: 127
  strict_feats: false
  t_emb_dim: 256
  token_dim: 768
  update_pair_repr: false
  update_pair_repr_every_n: 3
  use_qkln: true
  use_tri_mult: false
  x_sc_pair_dist_dim: 30
  x_sc_pair_dist_max: 3
  x_sc_pair_dist_min: 0.1
  xt_pair_dist_dim: 30
  xt_pair_dist_max: 3
  xt_pair_dist_min: 0.1
opt:
  accumulate_grad_batches: 8
  dist_strategy: auto
  grad_and_weight_analysis: false
  limit_train_batches: null
  lr: 0.0001
  max_epochs: 10000000
  skip_nan_grad: true
  val_check_interval: 5000
  warmup_steps: 500
pretrain_ckpt_path: /zfsauton/scratch/yixiz/Proteina-Complexa/ckpts/complexa.ckpt
product_flowmatcher:
  bb_ca:
    dim: 3
    guidance_enabled: true
    zero_com_noise: false
  local_latents:
    dim: null
    guidance_enabled: true
    zero_com_noise: false
run_name: cpsea_surfloss_from_v4cfg
seed: 42
show_prog_bar: true
training:
  cyclization_type_dropout_rate: 0.15
  fold_cond: false
  fold_label_sample_ratio:
  - 0.5
  - 0.1
  - 0.15
  - 0.25
  mask_A_prob: 0.5
  mask_C_prob: 0.5
  mask_T_prob: 0.5
  motif_conditioning: false
  n_recycle: 0
  p_folding_n_inv_folding_iters: 0.15
  self_cond: true
  target_cond: false
val_generation:
  design_sampling:
    args:
      ag_ckpt_path: null
      ag_ratio: 0.0
      fold_cond: false
      guidance_w: 1.0
      nsteps: 400
      save_trajectory_every: 0
      self_cond: true
    model:
      bb_ca:
        gt:
          clamp_val: null
          mode: 1/t
          p: 1.0
        schedule:
          mode: log
          p: 2.0
        simulation_step_params:
          center_every_step: false
          sampling_mode: sc
          sc_scale_noise: 0.1
          sc_scale_score: 1.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
          tsr_k: 1.0
          tsr_sigma: 1.0
      local_latents:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: power
          p: 2.0
        simulation_step_params:
          center_every_step: false
          sampling_mode: sc
          sc_scale_noise: 0.1
          sc_scale_score: 1.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
          tsr_k: 1.0
          tsr_sigma: 1.0
    n_recycle: 0
  enabled: true
  # Rosetta interface-dG sidecar (CPU, off the GPU path). The training job dumps a capped
  # sample of complexes here and (rank-0) resubmits scripts/submit_val_gen_rosetta.sh every
  # N validations, guarded so at most one runs per run_name; dG is logged back into THIS
  # wandb run as val_gen_rosetta/* by the training process (sole writer). See eval/val_gen_dump.py.
  rosetta_dump_dir: store/${run_name}/val_gen_rosetta_dump
  rosetta_auto_submit_every_n_vals: 1
  rosetta_dump_max: 8
  n_batches: 2
  n_repeat: 4
  nsteps: null
  self_cond: null

# Same contact loss as S2, reweighted and moved earlier in t. At S2's defaults
# (loss_weight 0.1, t_lower_lim 0.5) this term was 0.06% of the total train loss and
# only fired once x_t already encoded the pose -- see the header.
surface_loss:
  enabled: true
  mode: contact
  loss_weight: 2.0
  t_lower_lim: 0.1
