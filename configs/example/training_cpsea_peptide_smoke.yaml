# @package _global_
# CPSea cyclic-peptide binder smoke training (single GPU, ~20 steps)
#
# Prerequisites:
#   source env.sh                    # CPSEA_DATA_PATH, wandb keys, etc.
#   python script_utils/preprocess_cpsea.py --seed 42   # writes $CPSEA_DATA_PATH/preprocessed/
#
# Run (after full CPSea_PDB preprocess on scratch):
#   python -m proteinfoundation.train --config-name example/training_cpsea_peptide_smoke +single=true +nolog=true ++show_prog_bar=true
#
# Run (100-sample local smoke data, before scratch preprocess is ready):
#   python -m proteinfoundation.train --config-name example/training_cpsea_peptide_smoke +single=true +nolog=true ++show_prog_bar=true \
#     ++dataset.datamodule.metadata_file=${PWD}/CPSea_data/preprocessed_sample100/metadata/cpsea_train.parquet \
#     ++dataset.datamodule.val_metadata_file=${PWD}/CPSea_data/preprocessed_sample100/metadata/cpsea_val.parquet

run_name: cpsea_peptide_smoke

hardware:
  ncpus_per_task_train_: 4
  ncpus_per_task_prepro_: 4
  accelerator: gpu
  ngpus_per_node_: 1
  nnodes_: 1

defaults:
  - /nn: local_latents_score_nn_160M_binder
  - /generation: validation_local_latents
  - /dataset/unified: cpsea_peptide
  - _self_

# Finetune from public Complexa binder checkpoints (./ckpts/)
pretrain_ckpt_path: ${oc.env:CKPT_PATH}/complexa.ckpt
autoencoder_ckpt_path: ${oc.env:CKPT_PATH}/complexa_ae.ckpt

# Autoencoder training mode.
#   freeze_autoencoder: true  -> AE frozen; local_latents are a fixed regression target (default).
#   freeze_autoencoder: false -> JOINT training: encoder+decoder are trainable, the flow loss
#                                backprops into the encoder, and the AE's own recon+KL objective
#                                (scaled by ae_reg_weight) is added to keep the latent space anchored.
# Override at launch with: ++freeze_autoencoder=false ++ae_reg_weight=1.0
freeze_autoencoder: true
ae_reg_weight: 1.0

product_flowmatcher:
  bb_ca:
    zero_com_noise: False
    guidance_enabled: true
    dim: 3
  local_latents:
    zero_com_noise: False
    guidance_enabled: True
    dim: null

loss:
  t_distribution:
    bb_ca:
      name: mix_unif_beta
      p1: 1.9
      p2: 1.0
      p3: 0.02
    local_latents:
      name: uniform
      p1: 1.0
      p2: 1.0
    shared_groups: []

force_precision_f32: True

training:
  n_recycle: 0
  motif_conditioning: False
  self_cond: True
  fold_cond: False
  target_cond: False
  mask_T_prob: 0.5
  mask_A_prob: 0.5
  mask_C_prob: 0.5
  fold_label_sample_ratio: [0.5, 0.1, 0.15, 0.25]
  p_folding_n_inv_folding_iters: 0.15

lora:
  r: null
  lora_alpha: 32.0
  lora_dropout: 0.0
  train_bias: none

# Smaller loader + capped steps for smoke runs
dataset:
  datamodule:
    batch_size: 2
    num_workers: 4

opt:
  lr: 0.0001
  warmup_steps: 0  # >0 enables linear LR warmup (0 -> lr) then constant; 0 = no scheduler
  max_epochs: 1
  accumulate_grad_batches: 1
  skip_nan_grad: True
  grad_and_weight_analysis: False
  dist_strategy: auto
  val_check_interval: 999999  # skip validation during smoke
  limit_train_batches: 20

log:
  wandb_project: cpsea_peptide_smoke
  log_wandb: False
  log_every_n_steps: 1
  checkpoint: False
  checkpoint_every_n_steps: 10000
  last_ckpt_every_n_steps: 1500

seed: 42

ema:
  decay: 0.999
  validate_original_weights: False
  every_n_steps: 1
  cpu_offload: False
