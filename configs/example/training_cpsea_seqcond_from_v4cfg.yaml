# @package _global_
# SEQUENCE-CONDITIONED cyclic peptide generation: "here is the peptide sequence, generate
# the rest". Identical to training_cpsea_bondunroll_from_v4cfg.yaml (the current best arm:
# unrolled bond loss, ring PE, type conditioning) EXCEPT for `training.sequence_conditioning`
# and `val_generation.seq_cond`, plus a warm start from that arm's own checkpoint.
#
# WHAT "CONDITIONING ON SEQUENCE" MEANS HERE. The flow's product space is (bb_ca,
# local_latents). The sequence is NOT one of those variables -- it is a readout of the
# latents through the frozen autoencoder's decoder. So a given sequence cannot be handled by
# masking a generated variable; it enters as an INPUT FEATURE, `optional_res_type_seq_feat`
# (already in `nn.feats_seq` -- it has been there, and trained, all along), and the model
# must emit latents whose decoded residue types match what it was handed.
#
# WHY THE EXISTING MECHANISM WAS NOT USABLE, AND WHAT CHANGED. That feature is driven by
# `batch["use_residue_type_feature"]`, which until now was set by the legacy
# `p_folding_n_inv_folding_iters` draw: ONE BIT PER BATCH, on for ~7.5% of steps, all-or-
# nothing over residues, and -- decisively -- set NOWHERE at inference. So no sampling path
# could ever turn it on, and the channel was trained as an occasional curiosity rather than
# an interface. Three changes make it an interface:
#
#   1. `training.sequence_conditioning` draws the reveal PER EXAMPLE and PER RESIDUE, so a
#      partial sequence is expressible and every step carries both conditioned and
#      unconditioned examples instead of the whole batch flipping together.
#   2. The draw now happens BEFORE self-conditioning. It used to happen after, so the inner
#      `x_sc` forward ran unconditioned while the outer forward ran conditioned -- while at
#      sampling time every step's `x_sc` is produced WITH the sequence present. (That was a
#      latent bug in the legacy path too.)
#   3. `val_generation.seq_cond` runs a second, sequence-conditioned ODE integration and logs
#      `val_gen_seqcond/seq/cond_recovery`. That metric is the whole point: closure and
#      geometry look identical whether the model honours the sequence or quietly designs its
#      own, and only recovery separates the two.
#
# METRICS TO WATCH, in order of what they settle:
#   val_gen_seqcond/seq/cond_recovery   COMPLIANCE. Chance is ~0.05-0.15 (the aa marginal is
#                                       skewed). If this does not climb well clear of the
#                                       unconditioned model's `val_gen/seq`-equivalent, the
#                                       model is ignoring the channel and nothing else here
#                                       matters. Target: >0.9.
#   val_gen_seqcond/seq/cond_exact_frac PER-PEPTIDE pass/fail. This is the user-facing number
#                                       ("did I get back the peptide I asked for") and it
#                                       lags the position mean badly -- 0.95 per position on a
#                                       12-mer is ~0.54 per peptide.
#   val_gen_seqcond/cyc/*_success       closure UNDER conditioning. Compare against
#                                       `val_gen/cyc/*_success` in the SAME run, not against
#                                       another run: a fixed sequence removes the model's
#                                       freedom to place its own anchor residues, and project
#                                       memory records that isopeptide failure is ~50% ANCHOR
#                                       IDENTITY. Conditioning may therefore HELP closure when
#                                       the given sequence has good anchors and hurt it when
#                                       it does not. That gap is a result, not a regression.
#   val_gen/*                           the unconditional arm, still logged every validation.
#                                       `sequence_conditioning.p < 1` is what keeps it alive.
#
# WARM START. `pretrain_ckpt_path` points at the bondunroll run's own last.ckpt rather than
# complexa.ckpt. This is safe and cheap: no feature dimension changed (an unrevealed residue
# is the all-zero vector, not a 21st channel), so every tensor loads shape-for-shape, and the
# 20 input columns this arm leans on are already trained. `_splice_pretrained_weights` skips
# `autoencoder.*`, so the AE still comes from `autoencoder_ckpt_path` -- keep CPSEA_AE_CKPT_PATH
# pinned to the same AE bondunroll trained against or the loss curves stop being comparable.
#
# Run (smoke first -- see the handover command):
#   CONFIG_NAME=example/training_cpsea_seqcond_from_v4cfg \
#     RUN_NAME=cpsea_seqcond_from_v4cfg \
#     bash scripts/submit_replay_ablation_train.sh

ae_reg_weight: 1.0
autoencoder_ckpt_path: ${oc.env:CPSEA_AE_CKPT_PATH}
cyclization:
  allow_asn_gln_isopeptide: true
  bond_loss:
    enabled: true
    loss_weight: 0.05
    t_lower_lim: 0.5
    unroll:
      # Number of Euler steps from (x_t, t) to t=1. 1 == v4's one-step behaviour exactly.
      # 3 is the cheap setting that already moves the penalised object off the mean;
      # raise toward 5-8 if val_gen closure improves but has not converged, and accept
      # the forward cost. Beyond ~8 the rollout arm is the better spend.
      steps: 3
      # Steps at the END of the unroll that keep gradients (truncated backprop). This is
      # the MEMORY knob -- each one holds a full forward's activations. 1 is enough for
      # the endpoint gradient to reach the weights; 2 mainly buys a longer credit path.
      grad_steps: 1
      # Examples the unroll runs on, per step. THE memory knob, and not optional at v4's
      # batch_size=16: the gradient-carrying step builds a second full network graph
      # beside the one the flow loss already holds, and null (= whole batch) OOMs a 48G
      # a6000 at step 3 (job 33427). 4 keeps the added activations at ~1/4 of the main
      # graph. Costs only gradient variance on an auxiliary term -- the flow loss still
      # sees all 16 -- so raise it only if `train/cyclization_bond_window_success` looks
      # too noisy to read, and lower it before touching batch_size.
      max_samples: 4
      # Follow the model's own `training.self_cond` unless isolating its effect. A model
      # trained with self-conditioning is fed x_sc at every sampler step, so an unroll
      # that omits it evaluates the network off-distribution -- trading one train/sample
      # mismatch for another.
      self_cond: null
      # The unrolled endpoint is a genuine (coarse) sample even from a noisy start, so
      # the "predicted clean structure is meaningless here" argument behind the one-step
      # ramp weakens: this may go below `t_lower_lim`. 0.3 supervises roughly the top
      # 70% of flow time instead of the top 50%. Set null to reuse `t_lower_lim`.
      t_lower_lim: 0.3
  detach_link_inputs: true
  enabled: true
  force_gold_valid: true
  hidden_dim: 256
  loss_weight: 0.1
  target_type: null
  terminal_only: true
  type_conditioning: true
dataset:
  datamodule:
    batch_size: 16
    num_workers: 8
  unified:
    datamodule:
      _target_: proteinfoundation.datasets.structure_data.StructureDataModule
      atom37_transforms:
      - _target_: proteinfoundation.datasets.transforms.SegmentAwareResidueFeaturesTransform
        cn_break_cutoff: 2.0
        segment_fix_level: full
      - _target_: proteinfoundation.datasets.transforms.CoordsToNanometers
      - _target_: proteinfoundation.datasets.transforms.GlobalRotationTransform
      - _target_: proteinfoundation.datasets.transforms.CroppingTransform2
        binder_max_length: 16
        binder_min_length: 5
        binder_padding_length: 0
        crop_binder: false
        crop_size: 256
        data_mode: all-atom
        dist_mode: bb_ca
        interface_threshold: 8.0
        max_num_target_chains: -1
        target_min_length: 30
        target_spatial_crop_threshold: 15.0
      - _target_: proteinfoundation.datasets.transforms.ContactTransform
        contact_dropout_prob: 0.5
        contact_prob: 1.0
        cutoff: 8.0
        hotspot_dropout_prob: 0.5
        max_perc: 0.2
        min_perc: 0.0
      - _target_: proteinfoundation.datasets.transforms.OpenFoldFrameTransform
      - _target_: proteinfoundation.datasets.transforms.ChainBreakPerResidueTransform
      - _target_: proteinfoundation.datasets.transforms.CenteringTransform
        center_mode: target
        data_mode: all-atom
      - _target_: proteinfoundation.datasets.transforms.ExtractTargetCoordinatesTransform
        compact_mode: true
      - _target_: proteinfoundation.datasets.transforms.FilterTargetResiduesTransform
      - _target_: proteinfoundation.datasets.transforms.CyclizationLabelTransform
        default_binder_chain_id: B
      base_dir: ''
      batch_size: 6
      columns_to_load:
      - example_id
      - path
      - binder_chain_id
      - cluster_id
      - peptide_length
      - cyclization_type
      id_column: example_id
      metadata_file: /zfsauton/scratch/yixiz/CPSea/CPSea_full/CPSea/preprocessed/metadata/cpsea_train.parquet
      num_workers: 8
      path_column: path
      pin_memory: true
      use_parse: false
      val_metadata_file: /zfsauton/scratch/yixiz/CPSea/CPSea_full/CPSea/preprocessed/metadata/cpsea_val.parquet
ema:
  cpu_offload: false
  decay: 0.999
  every_n_steps: 1
  validate_original_weights: false
force_precision_f32: true
freeze_autoencoder: true
generation:
  args:
    ag_ckpt_path: null
    ag_ratio: 0.0
    fold_cond: false
    guidance_w: 1.0
    nsteps: 200
    self_cond: false
  dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 5
    collate_fn:
      _partial_: true
      _target_: proteinfoundation.datasets.gen_dataset.collate_fn
      padding_values:
        chains: -1
        target_chains: -1
    dataset:
      _target_: proteinfoundation.datasets.gen_dataset.GenDataset
      conditional_features: null
      nrepeat_per_sample: 20
      nres:
      - 50
      - 100
      task_name: null
      transforms: null
    shuffle: false
  metric:
    compute_designability: false
    compute_novelty_afdb: false
    compute_novelty_pdb: false
  model:
    ode:
      bb_ca:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: uniform
          p: 1.0
        simulation_step_params:
          center_every_step: true
          sampling_mode: vf
          sc_scale_noise: 0.0
          sc_scale_score: 0.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
      local_latents:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: uniform
          p: 1.0
        simulation_step_params:
          center_every_step: false
          sampling_mode: vf
          sc_scale_noise: 0.0
          sc_scale_score: 0.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
    temp_035_all:
      bb_ca:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: uniform
          p: 1.0
        simulation_step_params:
          center_every_step: true
          sampling_mode: sc
          sc_scale_noise: 0.35
          sc_scale_score: 1.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
      local_latents:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: uniform
          p: 1.0
        simulation_step_params:
          center_every_step: false
          sampling_mode: sc
          sc_scale_noise: 0.35
          sc_scale_score: 1.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
    temp_035_only_ca:
      bb_ca:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: uniform
          p: 1.0
        simulation_step_params:
          center_every_step: true
          sampling_mode: sc
          sc_scale_noise: 0.35
          sc_scale_score: 1.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
      local_latents:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: uniform
          p: 1.0
        simulation_step_params:
          center_every_step: false
          sampling_mode: vf
          sc_scale_noise: 0.0
          sc_scale_score: 0.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
hardware:
  accelerator: gpu
  ncpus_per_task_prepro_: 4
  ncpus_per_task_train_: 8
  ngpus_per_node_: 1
  nnodes_: 1
log:
  checkpoint: true
  checkpoint_every_n_steps: null
  last_ckpt_every_n_steps: 1500
  log_every_n_steps: 1
  log_wandb: true
  save_extra_checkpoints: false
  wandb_entity: null
  wandb_project: cpsea_cyclization
lora:
  lora_alpha: 32.0
  lora_dropout: 0.0
  r: null
  train_bias: none
loss:
  t_distribution:
    bb_ca:
      loss_t_clamp: 1.0
      name: mix_unif_beta
      p1: 1.9
      p2: 1.0
      p3: 0.02
    local_latents:
      name: uniform
      p1: 1.0
      p2: 1.0
    shared_groups: []
nn:
  concat_features:
    enable_ligand: false
    enable_motif: false
    enable_target: true
    ligand_pair_features: false
    motif_pair_features: false
    target_pair_features: true
  cyc_emb_dim: 256
  dim_cond: 256
  feats_cond_seq:
  - time_emb_bb_ca
  - time_emb_local_latents
  - cyclization_type_emb
  feats_pair_cond:
  - time_emb_bb_ca
  - time_emb_local_latents
  feats_pair_repr:
  - rel_seq_sep
  - xt_bb_ca_pair_dists
  - x_sc_bb_ca_pair_dists
  - optional_ca_pair_dist
  - chain_idx_pair
  - hotspot_mask_pair
  - cyclization_ring_pe
  feats_seq:
  - xt_bb_ca
  - xt_local_latents
  - x_sc_bb_ca
  - x_sc_local_latents
  - optional_ca_coors_nm_seq_feat
  - optional_res_type_seq_feat
  - hotspot_mask_seq
  - res_seq_pdb_idx
  idx_emb_dim: 256
  name: local_latents_transformer
  nheads: 12
  nlayers: 14
  output_parameterization:
    bb_ca: v
    local_latents: v
  pair_repr_dim: 256
  parallel_mha_transition: false
  ring_sep_dim: 32
  seq_sep_dim: 127
  strict_feats: false
  t_emb_dim: 256
  token_dim: 768
  update_pair_repr: false
  update_pair_repr_every_n: 3
  use_qkln: true
  use_tri_mult: false
  x_sc_pair_dist_dim: 30
  x_sc_pair_dist_max: 3
  x_sc_pair_dist_min: 0.1
  xt_pair_dist_dim: 30
  xt_pair_dist_max: 3
  xt_pair_dist_min: 0.1
opt:
  accumulate_grad_batches: 8
  dist_strategy: auto
  grad_and_weight_analysis: false
  limit_train_batches: null
  lr: 0.0001
  max_epochs: 10000000
  skip_nan_grad: true
  val_check_interval: 5000
  warmup_steps: 500
# Warm start from the bondunroll arm (see WARM START above). Set back to
# /zfsauton/scratch/yixiz/Proteina-Complexa/ckpts/complexa.ckpt to train this arm from the
# same starting point bondunroll had, at the cost of re-learning cyclization from scratch.
pretrain_ckpt_path: /zfsauton/scratch/yixiz/Proteina-Complexa/training_runs/store/cpsea_bondunroll_from_v4cfg/checkpoints/last.ckpt
product_flowmatcher:
  bb_ca:
    dim: 3
    guidance_enabled: true
    zero_com_noise: false
  local_latents:
    dim: null
    guidance_enabled: true
    zero_com_noise: false
run_name: cpsea_seqcond_from_v4cfg
seed: 42
show_prog_bar: true
training:
  cyclization_type_dropout_rate: 0.15
  sequence_conditioning:
    enabled: true
    # Per-example probability that ANY of the sequence is revealed. Below 1.0 on purpose:
    # the unconditional generator ("design me a peptide") must survive, both because it is
    # the model's other job and because it is the control that `val_gen/*` measures. 0.5
    # splits the gradient evenly; raise toward 0.8 only if compliance stalls.
    p: 0.5
    # Of the revealed examples, the fraction handed the ENTIRE sequence. This is the query
    # the user actually types, and under a continuous keep-fraction alone it is a measure-zero
    # event -- i.e. never trained. Not optional.
    p_full: 0.5
    # The rest get a keep fraction drawn uniformly in [min, max], then an independent
    # per-residue Bernoulli at that rate. Drawing the RATE per example (not one global rate)
    # means the model sees whole peptides that are 25% specified and whole peptides that are
    # 90% specified, instead of every row landing near the mean. This is what makes partial
    # specification -- "fix these four residues, generate the rest" -- work at inference.
    keep_frac_min: 0.25
    keep_frac_max: 1.0
  fold_cond: false
  fold_label_sample_ratio:
  - 0.5
  - 0.1
  - 0.15
  - 0.25
  mask_A_prob: 0.5
  mask_C_prob: 0.5
  mask_T_prob: 0.5
  motif_conditioning: false
  n_recycle: 0
  p_folding_n_inv_folding_iters: 0.15
  self_cond: true
  target_cond: false
val_generation:
  # Second, sequence-conditioned sampling pass, logged under `val_gen_seqcond/*`. Costs one
  # extra ODE integration per val batch (so ~2x this block's GPU time) and is the ONLY
  # non-teacher-forced measurement of whether the conditioning is honoured.
  #
  # A SEPARATE pass, not a fraction of the first one: mixing conditioned and unconditioned
  # samples into one metric set makes both unreadable, and the unconditional arm is the
  # control this is read against.
  seq_cond:
    enabled: true
    # 1.0 = reveal the whole binder sequence, i.e. measure the headline query. Lower it to
    # measure partial specification instead; the recovery metrics split conditioned from free
    # positions either way, so a value < 1 also populates `free_recovery` (a real prediction
    # number) which keep_frac=1 leaves NaN.
    keep_frac: 1.0
  design_sampling:
    args:
      ag_ckpt_path: null
      ag_ratio: 0.0
      fold_cond: false
      guidance_w: 1.0
      nsteps: 400
      save_trajectory_every: 0
      self_cond: true
    model:
      bb_ca:
        gt:
          clamp_val: null
          mode: 1/t
          p: 1.0
        schedule:
          mode: log
          p: 2.0
        simulation_step_params:
          center_every_step: false
          sampling_mode: sc
          sc_scale_noise: 0.1
          sc_scale_score: 1.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
          tsr_k: 1.0
          tsr_sigma: 1.0
      local_latents:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: power
          p: 2.0
        simulation_step_params:
          center_every_step: false
          sampling_mode: sc
          sc_scale_noise: 0.1
          sc_scale_score: 1.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
          tsr_k: 1.0
          tsr_sigma: 1.0
    n_recycle: 0
  enabled: true
  # Rosetta interface-dG sidecar (CPU, off the GPU path). The training job dumps a capped
  # sample of complexes here and (rank-0) resubmits scripts/submit_val_gen_rosetta.sh every
  # N validations, guarded so at most one runs per run_name; dG is logged back into THIS
  # wandb run as val_gen_rosetta/* by the training process (sole writer). See eval/val_gen_dump.py.
  rosetta_dump_dir: store/${run_name}/val_gen_rosetta_dump
  rosetta_auto_submit_every_n_vals: 1
  rosetta_dump_max: 8
  n_batches: 2
  n_repeat: 4
  nsteps: null
  self_cond: null
