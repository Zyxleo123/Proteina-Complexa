# @package _global_
# ARM B -- ROLLOUT FINE-TUNING (DRaFT-K). Byte-for-byte v4 (cpsea_cyc_ringpe_bond_v4's
# resolved config, distance-only bond_loss, no geometry, no replay) with ONLY the
# `rollout_finetune` block added.
#
# WHAT IT FIXES. Exposure bias -- the second, independent half of the train/design gap.
# Every teacher-forced objective, INCLUDING the unrolled bond loss, evaluates the network
# at `x_t = (1-t) x_0 + t x_1` built from ground-truth data. At design time `x_t` comes
# from the model's own accumulated output and has drifted off that manifold, so no
# teacher-forced loss ever visits the states the sampler actually occupies. v4's bond
# loss is additionally gated to t >= 0.5, and by t=0.5 the ODE has already committed to a
# global ring geometry that the remaining steps cannot undo.
#
# This term integrates the DEPLOYED sampler from t=0 (same schedule, same
# `simulation_step`, same noise as design -- `full_simulation_draft` is checked against
# `full_simulation` bit-for-bit in script_utils/test_unrolled_and_rollout.py), decodes
# the endpoint, and applies the same flat-bottom closing-bond penalty to the SAMPLE.
# Gradients are kept through the last `grad_steps` integration steps only, i.e. DRaFT-K
# (Clark et al., 2023). Truncation is a biased estimator of the policy gradient, chosen
# knowingly: the bias buys enough variance reduction to be trainable. Adjoint matching is
# the unbiased alternative if the bias ever proves to matter.
#
# WHY THIS IS NOT REWARD HACKING. (1) The term is strictly additive -- the real-data flow
# loss is computed on the same optimizer step and untouched, anchoring the model to the
# data distribution. (2) The reward is FLAT-BOTTOMED: once a ring closes inside its
# window the gradient is exactly zero, so there is no gradient pointing toward
# over-optimised closure at the expense of fold or interface quality. A one-sided
# "pull the ends together" reward would hack immediately, and has -- see the fused
# 0.76 A rings documented in cyclization/bond_loss.py.
#
# COST ARITHMETIC, and why `nsteps` here is 100 and not design's 400:
#   per triggered step:  nsteps * max_samples  extra forwards
#   amortised:           nsteps * max_samples / (batch_size * every_n_steps)
#   at 100 * 2 / (16 * 16) = 0.78x  the flow loss's own forward cost.
# Raising nsteps to design's 400 makes it 3.1x. nsteps is a FIDELITY knob, not just a
# cost one -- 100 trains a slightly different sampler than the 400-step one design runs.
# The vector field is shared, so it transfers, but if closure at 400 steps does not track
# closure at 100, raise this before concluding the method failed.
#
# METRIC TO WATCH: `train/rollout_window_success`. Unlike
# `train/cyclization_bond_window_success` it is measured on GENERATED structures, so it
# cannot sit near 1.0 while design closure sits near 0.6 -- it is the first training-time
# number in this project that is directly comparable to a design-time one. Watch it
# against the flow loss: if `rollout_window_success` climbs while the flow loss drifts
# up, lower `loss_weight`.
#
# COMBINING WITH ARM C: the two fix independent failures and compose. Once both are
# measured in isolation:
#   EXTRA_OVERRIDES="++cyclization.bond_loss.unroll.steps=3 \
#     ++cyclization.bond_loss.unroll.t_lower_lim=0.3"
#
# Run:
#   CONFIG_NAME=example/training_cpsea_rollout_draft_from_v4cfg \
#     RUN_NAME=cpsea_rollout_draft_from_v4cfg \
#     bash scripts/submit_replay_ablation_train.sh

ae_reg_weight: 1.0
autoencoder_ckpt_path: ${oc.env:CPSEA_AE_CKPT_PATH}
cyclization:
  allow_asn_gln_isopeptide: true
  bond_loss:
    enabled: true
    loss_weight: 0.05
    t_lower_lim: 0.5
  detach_link_inputs: true
  enabled: true
  force_gold_valid: true
  hidden_dim: 256
  loss_weight: 0.1
  target_type: null
  terminal_only: true
  type_conditioning: true
dataset:
  datamodule:
    batch_size: 16
    num_workers: 8
  unified:
    datamodule:
      _target_: proteinfoundation.datasets.structure_data.StructureDataModule
      atom37_transforms:
      - _target_: proteinfoundation.datasets.transforms.SegmentAwareResidueFeaturesTransform
        cn_break_cutoff: 2.0
        segment_fix_level: full
      - _target_: proteinfoundation.datasets.transforms.CoordsToNanometers
      - _target_: proteinfoundation.datasets.transforms.GlobalRotationTransform
      - _target_: proteinfoundation.datasets.transforms.CroppingTransform2
        binder_max_length: 16
        binder_min_length: 5
        binder_padding_length: 0
        crop_binder: false
        crop_size: 256
        data_mode: all-atom
        dist_mode: bb_ca
        interface_threshold: 8.0
        max_num_target_chains: -1
        target_min_length: 30
        target_spatial_crop_threshold: 15.0
      - _target_: proteinfoundation.datasets.transforms.ContactTransform
        contact_dropout_prob: 0.5
        contact_prob: 1.0
        cutoff: 8.0
        hotspot_dropout_prob: 0.5
        max_perc: 0.2
        min_perc: 0.0
      - _target_: proteinfoundation.datasets.transforms.OpenFoldFrameTransform
      - _target_: proteinfoundation.datasets.transforms.ChainBreakPerResidueTransform
      - _target_: proteinfoundation.datasets.transforms.CenteringTransform
        center_mode: target
        data_mode: all-atom
      - _target_: proteinfoundation.datasets.transforms.ExtractTargetCoordinatesTransform
        compact_mode: true
      - _target_: proteinfoundation.datasets.transforms.FilterTargetResiduesTransform
      - _target_: proteinfoundation.datasets.transforms.CyclizationLabelTransform
        default_binder_chain_id: B
      base_dir: ''
      batch_size: 6
      columns_to_load:
      - example_id
      - path
      - binder_chain_id
      - cluster_id
      - peptide_length
      - cyclization_type
      id_column: example_id
      metadata_file: /zfsauton/scratch/yixiz/CPSea/CPSea_full/CPSea/preprocessed/metadata/cpsea_train.parquet
      num_workers: 8
      path_column: path
      pin_memory: true
      use_parse: false
      val_metadata_file: /zfsauton/scratch/yixiz/CPSea/CPSea_full/CPSea/preprocessed/metadata/cpsea_val.parquet
ema:
  cpu_offload: false
  decay: 0.999
  every_n_steps: 1
  validate_original_weights: false
force_precision_f32: true
freeze_autoencoder: true
generation:
  args:
    ag_ckpt_path: null
    ag_ratio: 0.0
    fold_cond: false
    guidance_w: 1.0
    nsteps: 200
    self_cond: false
  dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 5
    collate_fn:
      _partial_: true
      _target_: proteinfoundation.datasets.gen_dataset.collate_fn
      padding_values:
        chains: -1
        target_chains: -1
    dataset:
      _target_: proteinfoundation.datasets.gen_dataset.GenDataset
      conditional_features: null
      nrepeat_per_sample: 20
      nres:
      - 50
      - 100
      task_name: null
      transforms: null
    shuffle: false
  metric:
    compute_designability: false
    compute_novelty_afdb: false
    compute_novelty_pdb: false
  model:
