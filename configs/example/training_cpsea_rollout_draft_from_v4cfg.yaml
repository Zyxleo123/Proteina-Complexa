nn:
  concat_features:
    enable_ligand: false
    enable_motif: false
    enable_target: true
    ligand_pair_features: false
    motif_pair_features: false
    target_pair_features: true
  cyc_emb_dim: 256
  dim_cond: 256
  feats_cond_seq:
  - time_emb_bb_ca
  - time_emb_local_latents
  - cyclization_type_emb
  feats_pair_cond:
  - time_emb_bb_ca
  - time_emb_local_latents
  feats_pair_repr:
  - rel_seq_sep
  - xt_bb_ca_pair_dists
  - x_sc_bb_ca_pair_dists
  - optional_ca_pair_dist
  - chain_idx_pair
  - hotspot_mask_pair
  - cyclization_ring_pe
  feats_seq:
  - xt_bb_ca
  - xt_local_latents
  - x_sc_bb_ca
  - x_sc_local_latents
  - optional_ca_coors_nm_seq_feat
  - optional_res_type_seq_feat
  - hotspot_mask_seq
  - res_seq_pdb_idx
  idx_emb_dim: 256
  name: local_latents_transformer
  nheads: 12
  nlayers: 14
  output_parameterization:
    bb_ca: v
    local_latents: v
  pair_repr_dim: 256
  parallel_mha_transition: false
  ring_sep_dim: 32
  seq_sep_dim: 127
  strict_feats: false
  t_emb_dim: 256
  token_dim: 768
  update_pair_repr: false
  update_pair_repr_every_n: 3
  use_qkln: true
  use_tri_mult: false
  x_sc_pair_dist_dim: 30
  x_sc_pair_dist_max: 3
  x_sc_pair_dist_min: 0.1
  xt_pair_dist_dim: 30
  xt_pair_dist_max: 3
  xt_pair_dist_min: 0.1
opt:
  accumulate_grad_batches: 8
  dist_strategy: auto
  grad_and_weight_analysis: false
  limit_train_batches: null
  lr: 0.0001
  max_epochs: 10000000
  skip_nan_grad: true
  val_check_interval: 5000
  warmup_steps: 500
pretrain_ckpt_path: /zfsauton/scratch/yixiz/Proteina-Complexa/ckpts/complexa.ckpt
product_flowmatcher:
  bb_ca:
    dim: 3
    guidance_enabled: true
    zero_com_noise: false
  local_latents:
    dim: null
    guidance_enabled: true
    zero_com_noise: false
run_name: cpsea_rollout_draft_from_v4cfg
seed: 42
show_prog_bar: true
training:
  cyclization_type_dropout_rate: 0.15
  fold_cond: false
  fold_label_sample_ratio:
  - 0.5
  - 0.1
  - 0.15
  - 0.25
  mask_A_prob: 0.5
  mask_C_prob: 0.5
  mask_T_prob: 0.5
  motif_conditioning: false
  n_recycle: 0
  p_folding_n_inv_folding_iters: 0.15
  self_cond: true
  target_cond: false
val_generation:
  design_sampling:
    args:
      ag_ckpt_path: null
      ag_ratio: 0.0
      fold_cond: false
      guidance_w: 1.0
      nsteps: 400
      save_trajectory_every: 0
      self_cond: true
    model:
      bb_ca:
        gt:
          clamp_val: null
          mode: 1/t
          p: 1.0
        schedule:
          mode: log
          p: 2.0
        simulation_step_params:
          center_every_step: false
          sampling_mode: sc
          sc_scale_noise: 0.1
          sc_scale_score: 1.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
          tsr_k: 1.0
          tsr_sigma: 1.0
      local_latents:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: power
          p: 2.0
        simulation_step_params:
          center_every_step: false
          sampling_mode: sc
          sc_scale_noise: 0.1
          sc_scale_score: 1.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
          tsr_k: 1.0
          tsr_sigma: 1.0
    n_recycle: 0
  enabled: true
  n_batches: 2
  n_repeat: 4
  nsteps: null
  self_cond: null

rollout_finetune:
  enabled: true
  # Weight on the additive sample-space term. Deliberately equal to the teacher-forced
  # bond loss's own weight rather than larger: this term is the noisier of the two (it
  # rides a truncated-backprop gradient through a stochastic sampler) and it is the one
  # with any capacity to pull the model off the data distribution.
  loss_weight: 0.05
  # ODE steps for the training rollout. See the cost arithmetic in the header. null uses
  # the design sampler's own nsteps (400) -- correct but ~4x more expensive.
  nsteps: 100
  # Steps at the END of the trajectory to backprop through. THE memory knob: each keeps a
  # full forward's activations alive. Start at 1. Going to 2 lengthens the credit path
  # into the region where the ring geometry is still being decided, at 2x the activation
  # cost of the rollout tail.
  grad_steps: 1
  # Run the rollout every N optimizer steps. Keyed off `global_step`, which is identical
  # on every DDP rank, so all ranks agree on which steps carry the term -- deriving the
  # cadence from anything rank-local would deadlock the all-reduce.
  every_n_steps: 16
  # Rollout batch size cap. The batch is TRUNCATED, not randomly subsampled, so a rerun
  # reproduces the step exactly.
  max_samples: 2
  # Follow the design sampler's own self_cond.
  self_cond: null
  # Also apply the linkage angle/dihedral term to the sampled structure. Defaults to
  # whatever `cyclization.bond_loss.geometry` is doing; false here because this arm is v4
  # (distance only) and the point is to isolate the rollout.
  geometry: false
  # The sampler to integrate. Copied verbatim from val_generation.design_sampling so
  # training, sampled validation and design cannot drift apart. There is deliberately NO
  # fallback to `generation.model["ode"]`: that is the unconditional-MONOMER sampler,
  # whose bb_ca.center_every_step=true zero-CoMs a binder that CPSea centres on its
  # TARGET. Training against samples from the wrong sampler is worse than not training
  # against samples at all, so a missing block raises rather than guessing.
  design_sampling:
    args:
      ag_ckpt_path: null
      ag_ratio: 0.0
      fold_cond: false
      guidance_w: 1.0
      nsteps: 400
      save_trajectory_every: 0
      self_cond: true
    model:
      bb_ca:
        gt:
          clamp_val: null
          mode: 1/t
          p: 1.0
        schedule:
          mode: log
          p: 2.0
        simulation_step_params:
          center_every_step: false
          sampling_mode: sc
          sc_scale_noise: 0.1
          sc_scale_score: 1.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
          tsr_k: 1.0
          tsr_sigma: 1.0
      local_latents:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: power
          p: 2.0
        simulation_step_params:
          center_every_step: false
          sampling_mode: sc
          sc_scale_noise: 0.1
          sc_scale_score: 1.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
          tsr_k: 1.0
          tsr_sigma: 1.0
    n_recycle: 0
