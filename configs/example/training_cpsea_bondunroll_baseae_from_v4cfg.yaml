# @package _global_
# ARM C, BASE-AE VARIANT -- the unrolled bond loss run against the *pre-CPSea* autoencoder.
#
# Byte-identical to training_cpsea_bondunroll_from_v4cfg.yaml except for two keys:
# `autoencoder_ckpt_path` (the manipulation) and `run_name`. Everything else -- dataset,
# lr, effective batch 128 (16 x 8), distance-only bond loss with unroll steps=3 /
# grad_steps=1 / max_samples=4 / t_lower_lim=0.3, ring PE, type conditioning, geometry
# loss OFF, seed 42 -- is untouched, so `cpsea_bondunroll_from_v4cfg` is the paired
# control and the AE is the only difference between them.
#
# THE MANIPULATION. Every CPSea flow run so far has regressed onto latents produced by
# `finetune_full_128` step-40000 EMA: the public `complexa_ae.ckpt` after ~40k steps of
# further training on CPSea binder chains. This arm reverts to `complexa_ae.ckpt` itself.
# Architecturally the two are the same network (latent_z_dim 8; encoder and decoder both
# 12 layers / token_dim 768 / 12 heads -- the finetune was inlined to byte-match for
# warm-start), so this is a pure weights swap: no shape changes anywhere in the flow model,
# whose `product_flowmatcher.local_latents.dim` is read off `autoencoder.latent_dim`.
#
# WHY IT MIGHT MATTER. The flow model is warm-started from `complexa.ckpt`
# (`pretrain_ckpt_path`, unchanged below), which was trained against the *base* AE's latent
# space. Every run to date therefore asks a pretrained flow model to hit a target that has
# since moved underneath it, and pays some of its budget re-learning the shifted latent
# space rather than learning cyclic peptides. Reverting the AE removes that mismatch. The
# cost is the other direction: peptide-finetuning presumably bought reconstruction quality
# on short binder chains, which is exactly the regime here. This run measures which effect
# dominates; nobody has run the comparison.
#
# LOSS CURVES ARE NOT COMPARABLE ACROSS THE PAIR -- DO NOT PLOT THEM TOGETHER. The AE
# *defines* the `local_latents` regression target, so the two arms are regressing onto
# different quantities and `train/loss_local_latents` measures different things in each.
# The same goes for `train/cyclization_bond_*`, which is computed on decoded coordinates.
# Only the SAMPLED, decoded-geometry metrics mean the same thing in both runs:
#
#   READ THIS ARM ON `val_gen/cyc/*_success`, broken out by linkage type, and nothing else.
#
# One extra readout comes free: `reconstruction_eval` reports the AE round-trip, so this
# run quantifies what CPSea finetuning actually bought the autoencoder in reconstruction
# terms -- the number the finetune was justified by but which was never re-checked against
# sampled closure. If base-AE round-trip is much worse but val_gen closure is unchanged,
# AE reconstruction is not the binding constraint on closure.
#
# NOTE ON THE PIN, AND WHY IT IS AN ABSOLUTE PATH. This is the one CPSea training config
# that does NOT read `${oc.env:CPSEA_AE_CKPT_PATH}` -- that variable points at the finetuned
# AE by definition, and lives only in gitignored `.env`/`env.sh`. The obvious substitute,
# `${oc.env:CKPT_PATH}/complexa_ae.ckpt` (the form `configs/search_binder_local_pipeline.yaml`
# uses), is NOT safe here: `env.sh` sources `.env` without `set -a` and explicitly exports
# only `CPSEA_AE_CKPT_PATH`, so `CKPT_PATH` never reaches the environment. Those configs work
# only because `train.py:main` calls `load_dotenv()` and OmegaConf resolves interpolations
# lazily on first access -- verified by composing this config under a real `source env.sh`,
# where `${oc.env:CKPT_PATH}` raises `Environment variable 'CKPT_PATH' not found`. An AE path
# that depends on resolution ORDER is the wrong thing to bet a 48 h run on, and silently
# picking up the wrong AE is precisely the failure this arm cannot survive. So the path is
# written out literally, exactly as `pretrain_ckpt_path` already is two dozen lines below.
#
# Run (1 x a6000, `general`, 48 h -- matching the conditions the other arms trained under;
# a replicate that trains for a different length is not a replicate):
#   CONFIG_NAME=example/training_cpsea_bondunroll_baseae_from_v4cfg \
#     RUN_NAME=cpsea_bondunroll_baseae \
#     PARTITION=general QOS=qos_general TIME=2-00:00:00 \
#     bash scripts/submit_replay_ablation_train.sh
#
# Smoke first (20 batches, no wandb, ~minutes) -- this is the first config to load the base
# AE into the cyclization training path, so confirm it constructs before spending 48 h:
#   CONFIG_NAME=example/training_cpsea_bondunroll_baseae_from_v4cfg \
#     RUN_NAME=cpsea_bondunroll_baseae_smoke \
#     PARTITION=general QOS=qos_general TIME=01:00:00 \
#     EXTRA_OVERRIDES="++opt.limit_train_batches=20 ++opt.max_epochs=1 ++log.log_wandb=false ++val_generation.enabled=false" \
#     bash scripts/submit_replay_ablation_train.sh
ae_reg_weight: 1.0
# PRE-CPSea autoencoder -- the public Complexa AE, before the CPSea binder-chain finetune.
# THIS LINE IS THE ENTIRE MANIPULATION. Every other CPSea arm loads
# ${oc.env:CPSEA_AE_CKPT_PATH} = finetune_full_128 step-40000 EMA, which is this checkpoint
# plus ~40k CPSea steps. Absolute on purpose -- see NOTE ON THE PIN in the header.
autoencoder_ckpt_path: /zfsauton/scratch/yixiz/Proteina-Complexa/ckpts/complexa_ae.ckpt
cyclization:
  allow_asn_gln_isopeptide: true
  bond_loss:
    enabled: true
    loss_weight: 0.05
    t_lower_lim: 0.5
    unroll:
      # Number of Euler steps from (x_t, t) to t=1. 1 == v4's one-step behaviour exactly.
      # 3 is the cheap setting that already moves the penalised object off the mean;
      # raise toward 5-8 if val_gen closure improves but has not converged, and accept
      # the forward cost. Beyond ~8 the rollout arm is the better spend.
      steps: 3
      # Steps at the END of the unroll that keep gradients (truncated backprop). This is
      # the MEMORY knob -- each one holds a full forward's activations. 1 is enough for
      # the endpoint gradient to reach the weights; 2 mainly buys a longer credit path.
      grad_steps: 1
      # Examples the unroll runs on, per step. THE memory knob, and not optional at v4's
      # batch_size=16: the gradient-carrying step builds a second full network graph
      # beside the one the flow loss already holds, and null (= whole batch) OOMs a 48G
      # a6000 at step 3 (job 33427). 4 keeps the added activations at ~1/4 of the main
      # graph. Costs only gradient variance on an auxiliary term -- the flow loss still
      # sees all 16 -- so raise it only if `train/cyclization_bond_window_success` looks
      # too noisy to read, and lower it before touching batch_size.
      max_samples: 4
      # Follow the model's own `training.self_cond` unless isolating its effect. A model
      # trained with self-conditioning is fed x_sc at every sampler step, so an unroll
      # that omits it evaluates the network off-distribution -- trading one train/sample
      # mismatch for another.
      self_cond: null
      # The unrolled endpoint is a genuine (coarse) sample even from a noisy start, so
      # the "predicted clean structure is meaningless here" argument behind the one-step
      # ramp weakens: this may go below `t_lower_lim`. 0.3 supervises roughly the top
      # 70% of flow time instead of the top 50%. Set null to reuse `t_lower_lim`.
      t_lower_lim: 0.3
  detach_link_inputs: true
  enabled: true
  force_gold_valid: true
  hidden_dim: 256
  loss_weight: 0.1
  target_type: null
  terminal_only: true
  type_conditioning: true
dataset:
  datamodule:
    batch_size: 16
    num_workers: 8
  unified:
    datamodule:
      _target_: proteinfoundation.datasets.structure_data.StructureDataModule
      atom37_transforms:
      - _target_: proteinfoundation.datasets.transforms.SegmentAwareResidueFeaturesTransform
        cn_break_cutoff: 2.0
        segment_fix_level: full
      - _target_: proteinfoundation.datasets.transforms.CoordsToNanometers
      - _target_: proteinfoundation.datasets.transforms.GlobalRotationTransform
      - _target_: proteinfoundation.datasets.transforms.CroppingTransform2
        binder_max_length: 16
        binder_min_length: 5
        binder_padding_length: 0
        crop_binder: false
        crop_size: 256
        data_mode: all-atom
        dist_mode: bb_ca
        interface_threshold: 8.0
        max_num_target_chains: -1
        target_min_length: 30
        target_spatial_crop_threshold: 15.0
      - _target_: proteinfoundation.datasets.transforms.ContactTransform
        contact_dropout_prob: 0.5
        contact_prob: 1.0
        cutoff: 8.0
        hotspot_dropout_prob: 0.5
        max_perc: 0.2
        min_perc: 0.0
      - _target_: proteinfoundation.datasets.transforms.OpenFoldFrameTransform
      - _target_: proteinfoundation.datasets.transforms.ChainBreakPerResidueTransform
      - _target_: proteinfoundation.datasets.transforms.CenteringTransform
        center_mode: target
        data_mode: all-atom
      - _target_: proteinfoundation.datasets.transforms.ExtractTargetCoordinatesTransform
        compact_mode: true
      - _target_: proteinfoundation.datasets.transforms.FilterTargetResiduesTransform
      - _target_: proteinfoundation.datasets.transforms.CyclizationLabelTransform
        default_binder_chain_id: B
      base_dir: ''
      batch_size: 6
      columns_to_load:
      - example_id
      - path
      - binder_chain_id
      - cluster_id
      - peptide_length
      - cyclization_type
      id_column: example_id
      metadata_file: /zfsauton/scratch/yixiz/CPSea/CPSea_full/CPSea/preprocessed/metadata/cpsea_train.parquet
      num_workers: 8
      path_column: path
      pin_memory: true
      use_parse: false
      val_metadata_file: /zfsauton/scratch/yixiz/CPSea/CPSea_full/CPSea/preprocessed/metadata/cpsea_val.parquet
ema:
  cpu_offload: false
  decay: 0.999
  every_n_steps: 1
  validate_original_weights: false
force_precision_f32: true
freeze_autoencoder: true
generation:
  args:
    ag_ckpt_path: null
    ag_ratio: 0.0
    fold_cond: false
    guidance_w: 1.0
    nsteps: 200
    self_cond: false
  dataloader:
