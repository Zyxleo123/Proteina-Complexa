        target_chains: -1
    dataset:
      _target_: proteinfoundation.datasets.gen_dataset.GenDataset
      conditional_features: null
      nrepeat_per_sample: 20
      nres:
      - 50
      - 100
      task_name: null
      transforms: null
    shuffle: false
  metric:
    compute_designability: false
    compute_novelty_afdb: false
    compute_novelty_pdb: false
  model:
    ode:
      bb_ca:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: uniform
          p: 1.0
        simulation_step_params:
          center_every_step: true
          sampling_mode: vf
          sc_scale_noise: 0.0
          sc_scale_score: 0.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
      local_latents:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: uniform
          p: 1.0
        simulation_step_params:
          center_every_step: false
          sampling_mode: vf
          sc_scale_noise: 0.0
          sc_scale_score: 0.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
    temp_035_all:
      bb_ca:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: uniform
          p: 1.0
        simulation_step_params:
          center_every_step: true
          sampling_mode: sc
          sc_scale_noise: 0.35
          sc_scale_score: 1.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
      local_latents:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: uniform
          p: 1.0
        simulation_step_params:
          center_every_step: false
          sampling_mode: sc
          sc_scale_noise: 0.35
          sc_scale_score: 1.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
    temp_035_only_ca:
      bb_ca:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: uniform
          p: 1.0
        simulation_step_params:
          center_every_step: true
          sampling_mode: sc
          sc_scale_noise: 0.35
          sc_scale_score: 1.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
      local_latents:
        gt:
          clamp_val: null
          mode: tan
          p: 1.0
        schedule:
          mode: uniform
          p: 1.0
        simulation_step_params:
          center_every_step: false
          sampling_mode: vf
          sc_scale_noise: 0.0
          sc_scale_score: 0.0
          t_lim_ode: 0.98
          t_lim_ode_below: 0.02
