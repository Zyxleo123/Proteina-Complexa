# @package _global_
# CPBind cyclic-peptide binder training with the ORIGINAL cyclization head.
#
# Deliberately the OLD behavior: the head predicts the whole (i, j, type) triple jointly from a
# single global softmax over the L*L*3 candidate space. The cyclization type is NOT an input --
# `type_conditioning: false`, no `cyclization_type_emb` in nn.feats_cond_seq, and no type
# dropout. This is the baseline; the type-conditioned variant lives in
# example/training_cpsea_peptide_cyc_typecond.yaml.
#
# Data: CPBind (545,300 structures; ~44x CPSea_PDB). Same preprocessing and column schema as
# CPSea, so only the dataset group changes.
#
# Run:
#   CONFIG=example/training_cpbind_peptide_cyc \
#     RUN_NAME=cpbind_cyc_head_bs16_accum8 \
#     WANDB_PROJECT=cpsea_cyclization \
#     CHECKPOINT=true \
#     AE_CKPT=$ZFS/Proteina-Complexa/training_runs/store/finetune_full_128/checkpoints/chk_epoch=00000002_step=000000040000-EMA.ckpt \
#     BS=16 ACCUM=8 LR=1e-4 WARMUP=500 \
#     bash ~/slurm/cpsea/cpsea_peptide_train_finetune.sh scratch
#
# NOTE on the launcher's data arg: pass `scratch` (not `full`). `full` repoints CPSEA_DATA_PATH
# at CPSea_full and asserts on its parquet; this config reads CPBIND_DATA_PATH via its own
# dataset group, so the launcher's data switch is irrelevant here and `scratch` is the one that
# does not fight it.

run_name: cpbind_peptide_cyc

hardware:
  ncpus_per_task_train_: 4
  ncpus_per_task_prepro_: 4
  accelerator: gpu
  ngpus_per_node_: 1
  nnodes_: 1

defaults:
  - /nn: local_latents_score_nn_160M_binder
  - /generation: validation_local_latents
  - /dataset/unified: cpbind_peptide
  - _self_

pretrain_ckpt_path: ${oc.env:CKPT_PATH}/complexa.ckpt
autoencoder_ckpt_path: ${oc.env:CPSEA_AE_CKPT_PATH}

freeze_autoencoder: true
ae_reg_weight: 1.0

product_flowmatcher:
  bb_ca:
    zero_com_noise: False
    guidance_enabled: true
    dim: 3
  local_latents:
    zero_com_noise: False
    guidance_enabled: True
    dim: null

loss:
  t_distribution:
    bb_ca:
      name: mix_unif_beta
      p1: 1.9
      p2: 1.0
      p3: 0.02
    local_latents:
      name: uniform
      p1: 1.0
      p2: 1.0
    shared_groups: []

force_precision_f32: True

training:
  n_recycle: 0
  motif_conditioning: False
  self_cond: True
  fold_cond: False
  target_cond: False
  mask_T_prob: 0.5
  mask_A_prob: 0.5
  mask_C_prob: 0.5
  fold_label_sample_ratio: [0.5, 0.1, 0.15, 0.25]
  p_folding_n_inv_folding_iters: 0.15
  # Old head: no type conditioning, so no type dropout.
  cyclization_type_dropout_rate: 0.0

# Original auxiliary head: joint (i, j, type) global softmax. Type is an OUTPUT, not an input.
cyclization:
  enabled: true
  loss_weight: 0.1
  hidden_dim: 256
  detach_link_inputs: true  # head trains; the flow model is left untouched by the CE
  force_gold_valid: true
  allow_asn_gln_isopeptide: true
  type_conditioning: false
  target_type: null

lora:
  r: null
  lora_alpha: 32.0
  lora_dropout: 0.0
  train_bias: none

dataset:
  datamodule:
    batch_size: 2
    num_workers: 4

opt:
  lr: 0.0001
  warmup_steps: 0
  max_epochs: 1
  accumulate_grad_batches: 1
  skip_nan_grad: True
  grad_and_weight_analysis: False
  dist_strategy: auto
  val_check_interval: 999999
  limit_train_batches: 20

log:
  wandb_project: cpsea_peptide
  log_wandb: False
  log_every_n_steps: 1
  checkpoint: False
  checkpoint_every_n_steps: null
  last_ckpt_every_n_steps: 1500
  save_extra_checkpoints: false

seed: 42

ema:
  decay: 0.999
  validate_original_weights: False
  every_n_steps: 1
  cpu_offload: False
